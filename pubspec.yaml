name: fitcoin
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Animation
  flutter_animate: ^4.5.0

  # Routing
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # API & Networking
  dio: ^5.4.0
  retrofit: ^4.0.0
  dio_smart_refresh: ^0.1.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Logging
  logger: ^2.4.0

  # Local Storage
  hive_flutter: ^1.1.0

  # Error Tracking
  sentry_flutter: ^9.26.0

  # Code Generation (Data Classes)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0
  very_good_analysis: ^6.0.0

  # Testing
  mocktail: ^1.0.0

  # Code Generators
  build_runner: ^2.4.11
  freezed: ^2.5.2  # ✅ Fixed version
  json_serializable: ^6.8.0
  retrofit_generator: ^9.0.0  # ✅ Fixed version

flutter:
  uses-material-design: true
  assets:
    - assets/images/